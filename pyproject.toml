[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pu-tool"
version = "0.1.0"
description = "Local-only PU Pocket Campus CLI and stdio MCP for your own PU account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10",
  "fastapi>=0.110",
  "httpx>=0.27",
  "keyring>=25",
  "mcp>=2.2.0,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "rich>=13.7",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
pu = "pu_tool.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pu_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

